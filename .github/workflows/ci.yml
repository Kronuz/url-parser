name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'  # nightly: flaky timing, and drift in libraries tracked at main
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: Kronuz/cpp-libraries/.github/workflows/cmake.yml@main
    with:
      cmake_args: -DURL_PARSER_BENCH=ON -DURL_PARSER_BENCH_ADA=ON -DURL_PARSER_SWEEP=ON  # builds the benchmark with its comparators and the sweep, which no test times
